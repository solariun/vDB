name=vDB
version=1.0.0
author=Gustavo Campos
maintainer=Gustavo Campos
sentence=An in-memory database with SQL, pipelines (|>) and CSV, in C++11 without the STL: the same code on a PC and on a microcontroller.
paragraph=Free-form records queried with standard SQL text (SELECT, JOIN, GROUP BY, subqueries, WITH, UNION, INSERT, UPDATE, DELETE) or a C++ word chain (db.select("name").from("t").where.field("age").gt(30).run()). Values are flexible text: math reads numbers, LIKE and REGEXP read text. Memory comes from a fixed arena you give it; running out is an error, never a crash.
category=Data Storage
url=https://github.com/solariun/vDB
architectures=*
includes=vdb.h
